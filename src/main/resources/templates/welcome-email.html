<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome to Link Shortener!</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .button { display: inline-block; padding: 12px 24px; background-color: #007bff; color: #fff; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Welcome!</h1>
    <p>Thank you for registering. To complete your account setup, please verify your email address by clicking the button below:</p>
    <p>
        <a th:href="${verificationUrl}" class="button">Verify My Email</a>
    </p>
    <p>If you did not create an account, you can safely ignore this email.</p>
    <p>Thanks,<br/>The Link Shortener Team</p>
</div>
</body>
</html>
